; VS NEURAL CAP for the browser build (packaging/package_web.py packs this as the page's data/neural/neural.ini).
; Same keys as neural.ini. Every character listed here goes into the page's download, and Vercel's free plan takes
; 100 MB a deployment in all (engine ~3 MB), so the opponents are small ones: see package_web.py --budget.
; For now the from-scratch Cap at 491M (what neural.ini plays) with the opponents its rates were measured on (SmartAI
; checks at 491.6M, 64 matches each). When the 52-specialist merge (rl/scripts/train_cap_merge_52.bat) is done, its
; network and its small opponents replace these.
[Neural]
policy = data/neural/cap_scratch491.m3nn
character = chars/captainamerica/captainamerica.def
stage = stages/gotham.def
opponent1 = chars/doom/doom.def, 0.98
opponent2 = chars/captainamerica/captainamerica.def, 0.72
