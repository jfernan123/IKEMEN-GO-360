; VS NEURAL CAP (title menu): a policy trained with mugen360's RL tools plays the computer.
; policy: the network, written by rl/export_policy.py from a checkpoint.
; character: who the policy plays (it trained only as this character, as player 1).
; stage: where it trained.
; opponent1, opponent2... = .def path, win rate: the characters it trained against and how often it beat them at the end of
; training (shown on the select screen). The mode only appears when the game has the character and the stage.
; play_vs_neural_cap.bat / play_vs_neural_thanos.bat copy neural_cap.ini or neural_thanos.ini over neural.ini.
; Neural Cap (from scratch): rl/checkpoints/cap_scratch_league/snap_000491520000.pt, 491.5M decisions, win/loss reward
; only, 8 buttons (the start of train_cap_thanos.bat, before it was widened). Rates are the SmartAI checks at 491.6M
; (64 matches each); Captain America's is against his own league.
[Neural]
policy = data/neural/cap_scratch491.m3nn
character = chars/captainamerica/captainamerica.def
stage = stages/gotham.def
opponent1 = chars/thanos/thanos.def, 0.00
opponent2 = chars/captainamerica/captainamerica.def, 0.72
opponent3 = chars/mvci venom/mvci venom.def, 0.98
opponent4 = chars/doom/doom.def, 0.98
opponent5 = chars/darkseid/darkseid.def, 0.04
opponent6 = chars/nightwing/nightwing.def, 0.98
