; VS NEURAL CAP (title menu): a policy trained with mugen360's RL tools plays the computer.
; policy: the network, written by rl/export_policy.py from a checkpoint.
; character: who the policy plays (it trained only as this character, as player 1).
; stage: where it trained.
; opponent1, opponent2... = .def path, win rate: the characters it trained against and how often it beat them at the end of
; training (shown on the select screen). The mode only appears when the game has the character and the stage.
; The 5-opponent policy before self-play: policy = data/neural/cap_vs5.m3nn (rl/checkpoints/pool_cap_vs5.pt, 309M).
[Neural]
policy = data/neural/cap_league.m3nn
character = chars/captainamerica/captainamerica.def
stage = stages/gotham.def
; rl/checkpoints/league_cap.pt (self-play league), 139.2M decisions: win rates over its last 200 matches against each;
; Captain America's is against its own league (the current policy and its snapshots).
opponent1 = chars/captainamerica/captainamerica.def, 0.79
opponent2 = chars/thanos/thanos.def, 0.86
opponent3 = chars/mvci venom/mvci venom.def, 0.61
opponent4 = chars/doom/doom.def, 0.98
opponent5 = chars/darkseid/darkseid.def, 0.85
opponent6 = chars/nightwing/nightwing.def, 0.96
