; Content loaded when mugen360 starts. Paths are relative to the folder containing the executable.
; Replace these with another compatible character or stage without rebuilding the engine.
[Game]
p1 = data/chars/kfm/kfm.def
p2 = data/chars/kfm/kfm.def
stage = data/stages/kfm.def
; The fight screen (lifebars, timer, round calls) from a MUGEN / Ikemen screenpack's fight.def.
fight = data/fight.def

; The select screen's roster, one per line as in MUGEN's select.def: a folder under data/chars ("kfm" loads
; data/chars/kfm/kfm.def) or a .def under data/chars. Leave both lists empty to skip the select screen and fight the
; [Game] characters above.
[Characters]
kfm
kfm720/kfm720.def

[Stages]
stages/kfm.def
