<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mugen360</title>
<!-- The browser build's page (build_web.bat copies it to dist/web/). It waits for a click (browsers only allow sound
     after one), then loads the game's files (game.data.js, from packaging/package_web.py) and the engine
     (mugen360.js / .wasm) into the canvas. -->
<style>
  :root { --bg: #07090f; --panel: #111726; --text: #e8ecf5; --dim: #8a94ab; --accent: #e8b84a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px; box-sizing: border-box; gap: 12px; }
  #stage { position: relative; width: min(100%, calc((100vh - 120px) * 16 / 9)); aspect-ratio: 16 / 9;
    background: #000; border-radius: 6px; overflow: hidden; box-shadow: 0 8px 40px #0008; }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; outline: none; }
  #cover { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; background: radial-gradient(circle, #1a2238 0%, #07090f 75%); cursor: pointer; }
  #cover h1 { margin: 0; font-size: clamp(24px, 5vw, 48px); letter-spacing: 0.06em; }
  #cover button { font: inherit; font-size: 18px; font-weight: 600; color: #111; background: var(--accent); border: 0;
    border-radius: 999px; padding: 12px 28px; cursor: pointer; }
  #status { color: var(--dim); min-height: 1.4em; text-align: center; }
  #bar { width: min(320px, 70%); height: 6px; background: #ffffff1a; border-radius: 3px; overflow: hidden; display: none; }
  #bar div { height: 100%; width: 0; background: var(--accent); transition: width 0.2s; }
  #help { color: var(--dim); font-size: 13px; text-align: center; max-width: 900px; }
  kbd { background: var(--panel); border: 1px solid #ffffff22; border-radius: 4px; padding: 0 5px; font-size: 12px; }
</style>
</head>
<body>
<main>
  <div id="stage">
    <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
    <div id="cover">
      <h1>MUGEN360</h1>
      <button id="play" type="button">Click to play</button>
      <div id="bar"><div></div></div>
      <div id="status"></div>
    </div>
  </div>
  <div id="help">
    <kbd>Arrows</kbd> move &middot; <kbd>U</kbd> <kbd>I</kbd> <kbd>O</kbd> punches &middot; <kbd>J</kbd> <kbd>K</kbd> <kbd>L</kbd> kicks
    &middot; <kbd>Enter</kbd> start &middot; <kbd>Esc</kbd> back / pause &middot; a gamepad works too.
    A C++ fighting-game engine running in WebAssembly.
  </div>
</main>
<script>
  const cover = document.getElementById("cover");
  const status = document.getElementById("status");
  const bar = document.getElementById("bar");
  const canvas = document.getElementById("canvas");

  function load(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = src;
      s.onload = resolve;
      s.onerror = () => reject(new Error("couldn't load " + src));
      document.body.appendChild(s);
    });
  }

  async function start() {
    cover.onclick = null;
    document.getElementById("play").remove();
    bar.style.display = "block";
    status.textContent = "Loading...";
    window.Module = {
      canvas,
      // The engine's log goes to the browser console.
      print: (text) => console.log(text),
      printErr: (text) => console.warn(text),
      // game.data.js reports its download here.
      setStatus: (text) => {
        const m = text.match(/\((\d+(?:\.\d+)?)\/(\d+)\)/);
        if (m) bar.firstElementChild.style.width = (100 * m[1] / m[2]).toFixed(1) + "%";
        if (text) status.textContent = text.replace(/\(.*\)/, "").trim() || "Loading...";
      },
      monitorRunDependencies: (left) => { if (!left) status.textContent = "Starting..."; },
      onRuntimeInitialized: () => { cover.style.display = "none"; canvas.focus(); },
      onAbort: (what) => { cover.style.display = "flex"; status.textContent = "The game stopped: " + what; },
    };
    try {
      await load("game.data.js");
      await load("mugen360.js");
    } catch (e) {
      status.textContent = e.message;
    }
  }

  cover.onclick = start;
  canvas.addEventListener("click", () => canvas.focus());
  // index.html?autostart: no click needed (for automated checks; the browser keeps the sound off until a click).
  if (new URLSearchParams(location.search).has("autostart")) start();
</script>
</body>
</html>
